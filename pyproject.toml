[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meu-jarvis"
version = "0.3.1"
description = "Assistente local para Windows com ferramentas controladas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9,<8"]

[project.optional-dependencies]
openai = ["openai>=2,<3"]
anthropic = ["anthropic>=0.60,<1"]
voice = ["numpy>=1.26,<3", "sounddevice>=0.5,<1", "openwakeword>=0.6,<1; sys_platform == 'win32' or python_version <= '3.11'", "faster-whisper>=1,<2", "pyttsx3>=2.90,<3"]
piper = ["piper-tts>=1.3,<2"]
neural = ["edge-tts>=7,<8", "av>=14,<19"]
windows = ["pycaw>=2024.1"]
memory = ["psycopg[binary]>=3.2,<4", "redis>=6,<8", "opensearch-py>=3,<4", "sentence-transformers>=5,<6"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
